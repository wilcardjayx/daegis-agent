<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DAegis — The Drain Never Happened</title>
    <meta name="description" content="An autonomous on-chain guardian that catches a malicious token approval and revokes it before a single token moves. Live threat registry on X Layer testnet." />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Open Graph. og.png is a supplied asset (place at public/og.png). -->
    <meta property="og:title" content="DAegis — The Drain Never Happened" />
    <meta property="og:description" content="An autonomous guardian that revokes a malicious approval before a token moves. Live on X Layer testnet." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Logo doubles as the favicon: replace public/logo1.png to change it. -->
    <link rel="icon" href="/daegis-agent/logo.jpg" />

    <!-- Theme init: set light/dark before first paint (no flash). Same pattern as
         the vanilla site; default dark for this design. -->
    <script>
      (function () {
        try {
          var s = localStorage.getItem('daegis_theme');
          var dark = s ? s === 'dark' : true;
          var r = document.documentElement;
          r.classList.toggle('dark', dark);
          r.classList.toggle('light', !dark);
          r.style.colorScheme = dark ? 'dark' : 'light';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', dark ? '#0A0A0A' : '#F5F5F7');
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/daegis-agent/assets/index-FlcqQOPx.js"></script>
    <link rel="stylesheet" crossorigin href="/daegis-agent/assets/index-B7icIPLS.css">
  </head>
  <body class="bg-[#09090b] text-[#f4f4f5] antialiased">
    <div id="root"></div>
  </body>
</html>
